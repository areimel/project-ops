# Keeps its own copy of the identity values; tests/brand.test.ts fails when they drift from shared/brand.ts.
appId: com.areimel.projectops
productName: Project Ops
copyright: Copyright © Alec Reimel. MIT licence.
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: build/tray.png
    to: tray.png
# Deep links: project-ops://open/projects/<id>
protocols:
  - name: Project Ops
    schemes:
      - project-ops
linux:
  target:
    - target: deb
      arch: x64
  category: Utility
  executableName: project-ops
  icon: build/icons
  maintainer: Alec Reimel <areimel@users.noreply.github.com>
  mimeTypes:
    - x-scheme-handler/project-ops
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
# Windows and macOS targets are configured but untested; build each on its own platform.
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
artifactName: project-ops_${version}_${arch}.${ext}
